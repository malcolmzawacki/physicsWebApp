name: Correctness Guardrails

on:
  push:
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node for card interaction checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate payload contract
        env:
          PYTHONPATH: .
        run: python tools/validate_payloads.py

      - name: Check prompt/answer consistency
        env:
          PYTHONPATH: .
        run: python tools/check_prompt_answer_consistency.py

      - name: Check activity interactions
        run: |
          python tools/test_activity_flow.py
          python tools/test_session_progress.py
          python tools/test_relative_motion_page.py
          python tools/test_recognizing_forces.py
          python tools/test_force_diagram_match.py
          python tools/test_force_diagram_builder.py
          python tools/test_force_motion_match.py
          python tools/test_force_change.py
          python tools/test_force_ranking.py
          node tools/test_graph_cards_frontend.js
          python tools/test_audit_regressions.py
          python tools/test_progress_and_formatting.py
          python tools/test_solve_for.py

      - name: Install worksheet PDF renderer
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-liberation fonts-dejavu-core

      - name: Check organizing-help contracts and reviewed families
        run: |
          python tools/test_setup_schema.py
          python tools/test_setup_workspace.py
          python tools/test_constant_setup.py
          python tools/test_momentum_setup.py
          python tools/test_wave_setup.py
          python tools/test_single_resistor_setup.py
          python tools/test_force_setup.py
          python tools/test_energy_setup.py
          python tools/test_conservation_setup.py
          python tools/test_thermal_setup.py
          python tools/test_friction_setup.py
          python tools/test_projectile_setup.py
          python tools/test_circuit_workspace.py
          python tools/build_organizing_inventory.py --check

      - name: Check student worksheets including PDF conversion
        run: python tools/test_student_worksheets.py
